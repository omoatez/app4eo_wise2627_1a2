[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "app4eo"
version = "0.1.0"
description = "Structured PyTorch Lightning experiments for Earth observation"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "torch>=2.6,<3",
  "torchvision>=0.21,<1",
  "lightning>=2.5,<3",
  "torchmetrics>=1.6,<2",
  "timm>=1.0.15,<2",
  "numpy>=1.26,<3",
  "rasterio>=1.4,<2",
  "matplotlib>=3.9,<4",
  "Pillow>=10,<13",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
analysis = ["umap-learn>=0.5.7,<1"]

[project.scripts]
app4eo = "experiments:main"
app4eo-analyze = "analysis:main"

[tool.setuptools]
py-modules = ["base", "models", "experiments", "features", "analysis", "run_gpu"]

[tool.setuptools.packages.find]
include = ["data*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

